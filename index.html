<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼국지 키즈 — 챕터1: 도원의 형제</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="screen-title" class="screen active">
  <div class="title-wrap">
    <h1>도원의 형제</h1>
    <p class="subtitle">삼국지 키즈 — 챕터1 프로토타입 (184~192)</p>
    <button id="btn-start" class="big-btn">시작하기</button>
  </div>
</div>

<div id="screen-select" class="screen">
  <div class="select-wrap">
    <h2>플레이할 장수를 고르세요</h2>
    <div class="hero-cards">
      <button class="hero-card" data-hero="gwanwoo">
        <div class="hero-swatch" style="background:#2f6d3f">관</div>
        <div class="hero-name">관우</div>
        <div class="hero-sub">청룡언월도 · 공92 방71 속58</div>
      </button>
      <button class="hero-card" data-hero="jangbi">
        <div class="hero-swatch" style="background:#8a3b2a">장</div>
        <div class="hero-name">장비</div>
        <div class="hero-sub">장팔사모 · 공94 방79 속61</div>
      </button>
    </div>
  </div>
</div>

<div id="screen-explore" class="screen">
  <div id="explore-viewport">
    <canvas id="game-canvas"></canvas>

    <div id="hud-top">
      <div id="hud-left">
        <span id="hud-date"></span>
        <span id="hud-ap"></span>
        <span id="hud-gold"></span>
        <span id="hud-rice"></span>
        <span id="hud-troop"></span>
        <span id="hud-fame"></span>
      </div>
      <div id="hud-actions">
        <button id="btn-train">훈련하기 (AP2)</button>
        <button id="btn-conscript">징병하기 (AP2)</button>
        <button id="btn-nextmonth">휴식</button>
        <button id="btn-progress" class="hidden">다음 사건으로</button>
      </div>
    </div>

    <div id="location-banner" class="hud-panel">
      <div id="location-name"></div>
      <div id="location-task"></div>
    </div>

    <div id="minimap-panel" class="hud-panel">
      <div id="minimap-title"></div>
      <canvas id="minimap-canvas" width="120" height="86"></canvas>
    </div>

    <div id="quest-panel" class="hud-panel">
      <div id="quest-title">탐색 중</div>
      <ul id="quest-list"></ul>
    </div>

    <div id="player-panel" class="hud-panel">
      <div id="player-portrait">
        <img id="player-portrait-img" src="" alt="" class="hidden">
        <div id="player-portrait-fallback"></div>
      </div>
      <div id="player-info">
        <div id="player-name"></div>
        <div class="stat-row hp-row"><span class="stat-label">체력</span><div class="stat-bar"><div class="stat-fill stat-hp" id="stat-fill-hp"></div></div><span class="stat-val hp-val" id="stat-val-hp"></span></div>
        <div class="stat-row"><span class="stat-label">공격</span><div class="stat-bar"><div class="stat-fill stat-atk" id="stat-fill-atk"></div></div><span class="stat-val" id="stat-val-atk"></span></div>
        <div class="stat-row"><span class="stat-label">방어</span><div class="stat-bar"><div class="stat-fill stat-def" id="stat-fill-def"></div></div><span class="stat-val" id="stat-val-def"></span></div>
        <div class="stat-row"><span class="stat-label">속도</span><div class="stat-bar"><div class="stat-fill stat-spd" id="stat-fill-spd"></div></div><span class="stat-val" id="stat-val-spd"></span></div>
        <div class="stat-row"><span class="stat-label">지력</span><div class="stat-bar"><div class="stat-fill stat-int" id="stat-fill-int"></div></div><span class="stat-val" id="stat-val-int"></span></div>
        <div class="stat-row"><span class="stat-label">매력</span><div class="stat-bar"><div class="stat-fill stat-cha" id="stat-fill-cha"></div></div><span class="stat-val" id="stat-val-cha"></span></div>
      </div>
    </div>

    <div id="bottom-menu">
      <button data-menu="bag">🎒<br>가방</button>
      <button data-menu="generals">🧑‍🤝‍🧑<br>장수</button>
      <button data-menu="log">📖<br>기록</button>
      <button data-menu="map">🗺<br>지도</button>
      <button data-menu="settings">⚙<br>설정</button>
    </div>

    <div id="touchpad">
      <button id="tp-up" class="tp-btn tp-up" aria-label="위로 이동">▲</button>
      <button id="tp-left" class="tp-btn tp-left" aria-label="왼쪽으로 이동">◀</button>
      <button id="tp-action" class="tp-btn tp-action" aria-label="대화/상호작용">대화</button>
      <button id="tp-right" class="tp-btn tp-right" aria-label="오른쪽으로 이동">▶</button>
      <button id="tp-down" class="tp-btn tp-down" aria-label="아래로 이동">▼</button>
    </div>
  </div>
  <div id="map-hint">화살표/WASD로 이동, 인물 옆에서 Enter/스페이스 또는 클릭으로 대화 (모바일은 아래 버튼 사용)</div>
</div>

<div id="screen-ending" class="screen">
  <div class="ending-wrap">
    <h2 id="ending-title">챕터1 클리어</h2>
    <div id="ending-summary"></div>
    <button id="btn-restart" class="big-btn">타이틀로</button>
  </div>
</div>

<!-- 대화창 -->
<div id="dialogue-box" class="hidden">
  <div id="dialogue-name"></div>
  <div id="dialogue-text"></div>
  <div id="dialogue-next"></div>
</div>

<!-- 선택지 모달 -->
<div id="choice-box" class="hidden">
  <div id="choice-text"></div>
  <div id="choice-buttons"></div>
</div>

<!-- 장수탭 -->
<div id="roster-box" class="hidden">
  <div id="roster-title">소속 장수</div>
  <div id="roster-list"></div>
  <button id="roster-close" class="big-btn">닫기</button>
</div>

<!-- 군세 편성 -->
<div id="army-box" class="hidden">
  <div id="army-title">유비군 군세 편성</div>
  <p id="army-desc">반동탁연합에 참전할 관우의 군세를 꾸리세요.</p>
  <div class="army-field">
    <label for="army-deputy">부장 (등용한 책사)</label>
    <select id="army-deputy"><option value="">없음</option></select>
  </div>
  <div class="army-field">
    <label for="army-troop">병사 수 (보유 <span id="army-troop-max"></span>명, 최소 500)</label>
    <input type="number" id="army-troop" min="0" max="10000" step="100">
  </div>
  <div class="army-field">
    <label for="army-rice">군량 · 쌀 (보유 <span id="army-rice-max"></span>가마)</label>
    <input type="number" id="army-rice" min="0" step="50">
  </div>
  <div id="army-hint"></div>
  <button id="army-confirm" class="big-btn">출정 준비 완료</button>
</div>

<!-- 일기토 배틀 화면 -->
<div id="battle-screen" class="hidden">
  <div class="battle-side" id="battle-side-e">
    <div class="battle-portrait" id="battle-e-portrait"></div>
    <div class="battle-name" id="battle-e-name"></div>
    <div class="bar hp"><div class="bar-fill" id="battle-e-hpfill"></div></div>
    <div class="bar-text" id="battle-e-hptext"></div>
    <div class="bar gauge"><div class="bar-fill" id="battle-e-gaugefill"></div></div>
  </div>

  <div class="battle-log" id="battle-log"></div>

  <div class="battle-side" id="battle-side-p">
    <div class="battle-portrait" id="battle-p-portrait"></div>
    <div class="battle-name" id="battle-p-name"></div>
    <div class="bar hp"><div class="bar-fill" id="battle-p-hpfill"></div></div>
    <div class="bar-text" id="battle-p-hptext"></div>
    <div class="bar gauge"><div class="bar-fill" id="battle-p-gaugefill"></div></div>
  </div>

  <div id="battle-actions">
    <button data-action="attack">⚔ 공격중시 (Enter/1)</button>
    <button data-action="defend">🛡 방어중시 (2)</button>
    <button data-action="skill">✦ 특기사용 (3)</button>
    <button id="btn-ultimate" data-action="ultimate" disabled>필살공격 (4)</button>
  </div>

  <div id="battle-skill-menu" class="hidden">
    <div id="battle-skill-title">필살공격 선택</div>
    <div id="battle-skill-list"></div>
    <button id="battle-skill-cancel">돌아가기</button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="js/data/roster.js"></script>
<script src="js/data/skills.js"></script>
<script src="js/data/maps.js"></script>
<script src="js/data/story.js"></script>
<script src="js/engine/state.js"></script>
<script src="js/engine/battle-events.js"></script>
<script src="js/engine/dialogue.js"></script>
<script src="js/engine/battle.js"></script>
<script src="js/engine/battle-vfx.js"></script>
<script src="js/engine/field-assets.js"></script>
<script src="js/engine/mapview.js"></script>
<script src="js/main.js"></script>
</body>
</html>
